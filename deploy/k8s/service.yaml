apiVersion: v1
kind: Service
metadata:
  name: sre-agent
  namespace: sre
  labels:
    app.kubernetes.io/name: sre-agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: sre-agent
