apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: sre
  labels:
    app.kubernetes.io/name: sre-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-agent
    spec:
      serviceAccountName: sre-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sre-agent-data
        - name: grpc-tls
          secret:
            secretName: sre-agent-grpc-tls
            optional: true
            defaultMode: 0400
      initContainers:
        - name: data-permissions
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "chown 10001:10001 /var/lib/sre-agent && chmod 0700 /var/lib/sre-agent"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/sre-agent
            - name: grpc-tls
              mountPath: /etc/sre-agent/grpc-tls
              readOnly: true
      containers:
        - name: sre-agent
          image: ghcr.io/kubebee-com/sre:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sre-agent-config
          env:
            - name: SRE_REQUIRE_API_TOKEN
              value: "true"
            - name: SRE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: SRE_API_TOKEN
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_CUSTOM_HEADERS
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: LLM_CUSTOM_HEADERS
                  optional: true
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: WEBHOOK_URL
                  optional: true
            - name: SRE_CACHE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: SRE_CACHE_ENCRYPTION_KEY
                  optional: true
            - name: SRE_DATA_DIR
              value: /var/lib/sre-agent
            - name: SRE_TRUSTED_CLIENT_IP_HEADER
              value: X-Forwarded-For
            # Empty is the safe default. Configure the ingress-nginx controller
            # ConfigMap to overwrite X-Forwarded-For before replacing this with
            # the exact ingress-controller peer CIDR; never use a general client
            # or pod network.
            - name: SRE_TRUSTED_PROXY_CIDRS
              value: ""
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/sre-agent
            - name: grpc-tls
              mountPath: /etc/sre-agent/grpc-tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
