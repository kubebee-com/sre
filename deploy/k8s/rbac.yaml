apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent
rules:
  # Proactive telemetry scanning & diagnosis
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "nodes", "persistentvolumeclaims", "persistentvolumes", "configmaps", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Permission-gated remediation actions (safe remediation)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent
