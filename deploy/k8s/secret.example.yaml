apiVersion: v1
kind: Secret
metadata:
  name: sre-agent-secrets
  namespace: sre
type: Opaque
stringData:
  # Required for the authenticated API and dashboard. Replace before applying.
  SRE_API_TOKEN: "replace-with-a-long-random-token"
  # Provide either Anthropic, OpenAI, or DeepSeek API key depending on LLM_PROVIDER
  LLM_API_KEY: "your-api-key-here"
  # Optional comma-separated provider headers, for example X-Tenant:team-a
  LLM_CUSTOM_HEADERS: ""
  # Optional webhook for Slack or Discord notifications
  WEBHOOK_URL: "https://hooks.slack.com/services/..."
  # Optional cache key; only used when SRE_CACHE_DIR is configured.
  SRE_CACHE_ENCRYPTION_KEY: "replace-with-a-random-cache-key"
