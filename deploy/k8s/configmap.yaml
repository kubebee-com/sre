apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-agent-config
  namespace: sre
data:
  SRE_GRPC_PORT: "0"
  SRE_GRPC_TLS_CERT_FILE: /etc/sre-agent/grpc-tls/tls.crt
  SRE_GRPC_TLS_KEY_FILE: /etc/sre-agent/grpc-tls/tls.key
  SRE_GRPC_TLS_CLIENT_CA_FILE: /etc/sre-agent/grpc-tls/ca.crt
  SRE_GRPC_REFLECTION: "false"
  SRE_ENABLE_AWS_EKS: "false"
  AWS_REGION: ""
  SRE_EKS_CLUSTER_NAME: ""
  SRE_CACHE_DIR: ""
  SRE_CACHE_TTL: "15m"
  SRE_CACHE_MAX_ENTRIES: "256"
  SRE_CACHE_MAX_VALUE_BYTES: "1048576"
  LLM_PROVIDER: "rule-based"
  LLM_MODE: ""
  LLM_MODEL: ""
  LLM_BASE_URL: ""
  LLM_ENDPOINT_ALLOWLIST: ""
  LLM_ORGANIZATION: ""
  LLM_PROXY_URL: ""
  PUBLIC_URL: "https://sre.kubebee.com"
  SCAN_INTERVAL: "2m"
  SRE_SCAN_JITTER: "15s"
  SRE_LEADER_ELECTION: "true"
  SRE_LEADER_ELECTION_NAMESPACE: "sre"
  SRE_LEADER_ELECTION_ID: "sre-agent"
  SRE_LEADER_ELECTION_IDENTITY: ""
  SRE_SCAN_CONCURRENCY: "4"
  SRE_SCAN_TIMEOUT: "90s"
