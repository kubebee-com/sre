apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sre-agent
  namespace: sre
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/common-name: sre.kubebee.com
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - sre.kubebee.com
      secretName: sre-kubebee-com-tls
  rules:
    - host: sre.kubebee.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sre-agent
                port:
                  number: 8080
