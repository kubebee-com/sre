{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-agent.secretName" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  SRE_API_TOKEN: {{ required "secret.apiToken is required when secret.create=true" .Values.secret.apiToken | quote }}
  {{- with .Values.secret.llmAPIKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.llmCustomHeaders }}
  LLM_CUSTOM_HEADERS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.webhookURL }}
  WEBHOOK_URL: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
