{{- include "sre-agent.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sre-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sre-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sre-agent.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.grpc.tls.enabled }}
        - name: grpc-tls
          secret:
            secretName: {{ required "grpc.tls.secretName is required when grpc.tls.enabled=true" .Values.grpc.tls.secretName }}
            defaultMode: 0400
        {{- end }}
      containers:
        - name: sre-agent
          image: {{ include "sre-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.grpc.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "sre-agent.configMapName" . }}
          env:
            - name: SRE_REQUIRE_API_TOKEN
              value: {{ .Values.auth.requireAPIToken | quote }}
            - name: SRE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.secretName" . }}
                  key: SRE_API_TOKEN
                  optional: {{ not .Values.auth.requireAPIToken }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.secretName" . }}
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_CUSTOM_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.secretName" . }}
                  key: LLM_CUSTOM_HEADERS
                  optional: true
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.secretName" . }}
                  key: WEBHOOK_URL
                  optional: true
            - name: SRE_CACHE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.secretName" . }}
                  key: SRE_CACHE_ENCRYPTION_KEY
                  optional: true
            - name: SRE_DATA_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: SRE_TRUSTED_CLIENT_IP_HEADER
              value: {{ .Values.auth.trustedClientIPHeader | quote }}
            - name: SRE_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.auth.trustedProxyCIDRs | quote }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- if .Values.grpc.tls.enabled }}
            - name: grpc-tls
              mountPath: {{ .Values.grpc.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
