apiVersion: v1
kind: Pod
metadata:
  name: pod-pending-scheduling
  namespace: sre-fixtures
  labels:
    sre.kubebee.com/fixture-id: pod-pending-scheduling
    sre.kubebee.com/fixture: "true"
spec:
  restartPolicy: Never
  nodeSelector:
    sre-fixture-node: does-not-exist
  containers:
    - name: pending
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
---
