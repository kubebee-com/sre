    - name: service-target
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      ports:
        - name: actual
          containerPort: 9090
---
apiVersion: v1
kind: Pod
metadata:
  name: security-privilege
  namespace: sre-fixtures
  labels:
    sre.kubebee.com/fixture-id: security-privilege
    sre.kubebee.com/fixture: "true"
spec:
  hostPID: true
  restartPolicy: Never
  containers:
    - name: privileged
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
      volumeMounts:
        - name: host
          mountPath: /host
          readOnly: true
  volumes:
    - name: host
      hostPath:
        path: /var/lib
        type: Directory
