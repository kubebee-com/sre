apiVersion: batch/v1
kind: Job
metadata:
  name: job-failed
  namespace: sre-fixtures
  labels:
    sre.kubebee.com/fixture-id: job-failed
    sre.kubebee.com/fixture: "true"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: job-failed
    spec:
      restartPolicy: Never
      containers:
        - name: failed
          image: busybox:1.36.1
          command: ["sh", "-c", "echo job failure; exit 1"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-suspended
  namespace: sre-fixtures
  labels:
    sre.kubebee.com/fixture-id: cronjob-suspended
    sre.kubebee.com/fixture: "true"
spec:
  schedule: "*/5 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cronjob-suspended
        spec:
          restartPolicy: Never
          containers:
            - name: cron
              image: busybox:1.36.1
              command: ["sh", "-c", "echo cron fixture"]
